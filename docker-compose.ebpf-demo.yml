# eBPF Demo Services
# Go, Java, and Python services with no OTel SDK, traced by OpenTelemetry eBPF Instrumentation (OBI).
#
# This file is included by docker-compose.yml via the 'include:' directive.
# To use: set INCLUDE_COMPOSE_EBPF_DEMO=docker-compose.ebpf-demo.yml in .env, then run: docker compose up -d
#
# Linux hosts only. OBI runs privileged with the host PID namespace and host network.

x-default-logging: &logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"
    tag: "{{.Name}}"

x-ebpf-demo-app: &ebpf-demo-app
  logging: *logging
  networks:
    - observability-stack-network
  restart: unless-stopped

services:
  obi:
    image: otel/ebpf-instrument:v0.14.0
    container_name: obi
    privileged: true
    pid: host
    network_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /sys/kernel/security:/sys/kernel/security
      - /sys/kernel/tracing:/sys/kernel/tracing
    environment:
      OTEL_EBPF_BPF_CONTEXT_PROPAGATION: all
      # Only the demo services listen on these ports.
      OTEL_EBPF_OPEN_PORT: "18101-18104"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:${OTEL_COLLECTOR_PORT_HTTP:-4318}
    logging: *logging
    restart: unless-stopped

  storefront:
    <<: *ebpf-demo-app
    build: ./examples/ebpf-demo/go
    container_name: storefront
    environment:
      OTEL_SERVICE_NAME: storefront
      PORT: "18101"
      CALLS: http://catalog:18102/products,http://ratings:18103/ratings

  catalog:
    <<: *ebpf-demo-app
    build: ./examples/ebpf-demo/java
    container_name: catalog
    environment:
      OTEL_SERVICE_NAME: catalog
      PORT: "18102"
      CALLS: http://inventory:18104/stock

  ratings:
    <<: *ebpf-demo-app
    build: ./examples/ebpf-demo/python
    container_name: ratings
    environment:
      OTEL_SERVICE_NAME: ratings
      PORT: "18103"
      CALLS: http://inventory:18104/stock

  inventory:
    <<: *ebpf-demo-app
    build: ./examples/ebpf-demo/go
    container_name: inventory
    environment:
      OTEL_SERVICE_NAME: inventory
      PORT: "18104"

  ebpf-demo-loadgen:
    <<: *ebpf-demo-app
    image: busybox:1.36
    container_name: ebpf-demo-loadgen
    depends_on: [obi, storefront, catalog, ratings, inventory]
    # Start after OBI attaches. On kernels before 6.4, OBI can't propagate on connections opened before it started.
    command: ["sh", "-c", "sleep 60; while true; do wget -qO- http://storefront:18101/checkout >/dev/null 2>&1; sleep 1; done"]
