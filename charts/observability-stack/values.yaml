# Default values for observability-stack umbrella chart
# Mirrors the docker-compose setup for Kubernetes deployment

# -- OpenSearch
# Sizing guide:
#   Storage: daily_ingest_GB × 1.45 × (replicas + 1) × retention_days
#   Shards:  30–50 GB per shard for logs/traces, 10–30 GB for search
#   JVM:     50% of node RAM, max ~31 GB (set via OPENSEARCH_JAVA_OPTS)
#   Nodes:   minimum 3 for production, 1 for dev/demo
#   Heap-to-shard ratio: max 25 shards per GB of JVM heap
opensearch:
  enabled: true
  singleNode: true
  replicas: 1
  image:
    repository: "opensearchstaging/opensearch"
    tag: "3.6.0"
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 8Gi                    # Increase for production (e.g. 100Gi, 500Gi)
    # storageClass: "gp3"       # Uncomment for AWS gp3 (better IOPS/$ than gp2)
  extraEnvs:
    - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      value: "My_password_123!@#"
    # JVM heap — set to 50% of resources.requests.memory, max 31g
    - name: OPENSEARCH_JAVA_OPTS
      value: "-Xms1g -Xmx1g"
  config:
    opensearch.yml: |
      plugins.query.datasources.encryption.masterkey: "BTqK4Ytdz67La1kShIKV3Pu9"

# -- OpenSearch Dashboards
opensearch-dashboards:
  enabled: true
  replicas: 1
  image:
    repository: "opensearchstaging/opensearch-dashboards"
    tag: "3.6.0"
  opensearchHosts: "https://opensearch-cluster-master:9200"
  config:
    opensearch_dashboards.yml: |
      server.host: "0.0.0.0"
      server.name: "observability-stack-dashboards"
      opensearch.hosts: ["https://opensearch-cluster-master:9200"]
      opensearch.username: "admin"
      opensearch.password: "My_password_123!@#"
      opensearch.ssl.verificationMode: none
      opensearch.requestTimeout: 30000
      opensearch.requestHeadersAllowlist: ["authorization", "securitytenant"]
      opensearch_security.multitenancy.enabled: false
      opensearch_security.readonly_mode.roles: ["kibana_read_only"]
      console.enabled: true
      server.maxPayloadBytes: 1048576
      savedObjects.maxImportPayloadBytes: 26214400
      csp.strict: false
      explore.enabled: true
      explore.discoverTraces.enabled: true
      explore.discoverMetrics.enabled: true
      explore.agentTraces.enabled: true
      workspace.enabled: true
      data_source.enabled: true
      data_source.ssl.verificationMode: none
      datasetManagement.enabled: true
      data.savedQueriesNewUI.enabled: true
      opensearchDashboards.branding.useExpandedHeader: false
      uiSettings.overrides.home:useNewHomePage: true
      uiSettings.overrides.query:enhancements:enabled: true
      uiSettings.overrides.explore:experimental: true

# -- Data Prepper
data-prepper:
  enabled: true
  image:
    repository: "sgguruda62324/opensearch-data-prepper"
    tag: "2.15.0-SNAPSHOT"
  ports:
    - name: http-source
      port: 2021
    - name: otel-traces
      port: 21890
    - name: otel-metrics
      port: 21891
    - name: otel-logs
      port: 21892
    - name: metrics
      port: 4900
  config:
    data-prepper-config.yaml: |
      ssl: false
      peer_forwarder:
        ssl: false
      experimental:
        enabled_plugins:
          processor:
            - otel_apm_service_map
          sink:
            - prometheus
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 10
  pipelineConfig:
    enabled: true
    config:
      # Main OTLP pipeline - receives all telemetry and routes by type
      otlp-pipeline:
        delay: 10
        source:
          otlp:
            port: 21890
            ssl: false
        route:
          - logs: 'getEventType() == "LOG"'
          - traces: 'getEventType() == "TRACE"'
        sink:
          - pipeline:
              name: "otel-logs-pipeline"
              routes: ["logs"]
          - pipeline:
              name: "otel-traces-pipeline"
              routes: ["traces"]

      otel-logs-pipeline:
        workers: 5
        delay: 10
        source:
          pipeline:
            name: "otlp-pipeline"
        buffer:
          bounded_blocking: {}
        processor:
          - copy_values:
              entries:
                - from_key: "time"
                  to_key: "@timestamp"
        sink:
          - opensearch:
              hosts: ["https://opensearch-cluster-master:9200"]
              username: "admin"
              password: "My_password_123!@#"
              insecure: true
              index_type: log-analytics-plain
              # Shard tuning — adjust for ingest volume:
              #   1 shard handles ~30-50 GB for logs. Scale shards with data node count.
              # number_of_shards: 1
              # number_of_replicas: 1

      otel-traces-pipeline:
        delay: 100
        source:
          pipeline:
            name: "otlp-pipeline"
        sink:
          - pipeline:
              name: "traces-raw-pipeline"
          - pipeline:
              name: "service-map-pipeline"

      traces-raw-pipeline:
        source:
          pipeline:
            name: "otel-traces-pipeline"
        processor:
          - otel_traces: {}
        sink:
          - opensearch:
              hosts: ["https://opensearch-cluster-master:9200"]
              username: "admin"
              password: "My_password_123!@#"
              insecure: true
              index_type: trace-analytics-plain-raw
              # number_of_shards: 1
              # number_of_replicas: 1

      service-map-pipeline:
        delay: 100
        source:
          pipeline:
            name: "otel-traces-pipeline"
        processor:
          - otel_apm_service_map:
              group_by_attributes: [telemetry.sdk.language]
              window_duration: 10s
        route:
          - otel_apm_service_map_route: 'getEventType() == "SERVICE_MAP"'
          - service_processed_metrics: 'getEventType() == "METRIC"'
        sink:
          - opensearch:
              hosts: ["https://opensearch-cluster-master:9200"]
              username: "admin"
              password: "My_password_123!@#"
              index_type: otel-v2-apm-service-map
              routes: [otel_apm_service_map_route]
              insecure: true
          - prometheus:
              url: "http://obs-stack-prometheus-server:80/api/v1/write"
              threshold:
                max_events: 500
                flush_interval: 5s
              routes: [service_processed_metrics]

# -- OpenTelemetry Collector
opentelemetry-collector:
  enabled: true
  mode: deployment
  image:
    repository: "otel/opentelemetry-collector-contrib"
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - "http://*"
                - "https://*"
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        timeout: 10s
        send_batch_size: 1024
      resourcedetection:
        detectors: [env]
      transform:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - replace_pattern(name, "\\?.*", "")
              # Workaround for https://github.com/opensearch-project/data-prepper/issues/5616
              - set(attributes["error_type"], attributes["error.type"]) where attributes["error.type"] != nil
              - delete_key(attributes, "error.type")
        log_statements:
          - context: log
            statements:
              - flatten(body) where IsMap(body)
              - set(body, ToKeyValueString(body)) where IsMap(body)
    exporters:
      debug:
        verbosity: detailed
      otlp/opensearch:
        endpoint: "obs-stack-data-prepper:21890"
        tls:
          insecure: true
      otlphttp/prometheus:
        endpoint: "http://obs-stack-prometheus-server:80/api/v1/otlp"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resourcedetection, memory_limiter, transform, batch]
          exporters: [otlp/opensearch, debug]
        metrics:
          receivers: [otlp]
          processors: [resourcedetection, memory_limiter, batch]
          exporters: [otlphttp/prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [resourcedetection, memory_limiter, transform, batch]
          exporters: [otlp/opensearch, debug]

  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

# -- Prometheus
prometheus:
  enabled: true
  server:
    # Retention — how long Prometheus keeps metrics. Increase for longer history.
    retention: "15d"
    persistentVolume:
      enabled: false               # Enable for production (survives pod restarts)
      # size: 50Gi
    extraFlags:
      - "web.enable-remote-write-receiver"
      - "web.enable-otlp-receiver"
    global:
      scrape_interval: 60s
      scrape_timeout: 10s
      evaluation_interval: 60s
      external_labels:
        cluster: 'observability-stack'
        environment: 'development'
  # Disable default K8s scrape configs — they add ~60k series from API server internals.
  # We keep node-exporter and kube-state-metrics (scraped via service endpoints below),
  # and add explicit scrape for OTel Collector and Prometheus self-monitoring.
  scrapeConfigs:
    # Disable noisy defaults
    kubernetes-api-servers: { enabled: false }
    kubernetes-nodes: { enabled: false }
    kubernetes-nodes-cadvisor: { enabled: false }
    kubernetes-pods: { enabled: false }
    kubernetes-pods-slow: { enabled: false }
    kubernetes-service-endpoints: { enabled: false }
    kubernetes-service-endpoints-slow: { enabled: false }
    kubernetes-services: { enabled: false }
    prometheus-pushgateway: { enabled: false }
    # Keep self-monitoring + OTel Collector
    prometheus:
      static_configs:
        - targets: ['localhost:9090']
    otel-collector:
      static_configs:
        - targets: ['obs-stack-opentelemetry-collector:8888']
      scrape_interval: 10s
    opensearch:
      static_configs:
        - targets: ['obs-stack-observability-stack-opensearch-exporter:9114']
      scrape_interval: 30s
    data-prepper:
      metrics_path: '/metrics/prometheus'
      static_configs:
        - targets: ['obs-stack-data-prepper:4900']
      scrape_interval: 30s
    node-exporter:
      kubernetes_sd_configs:
        - role: endpoints
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          regex: obs-stack-prometheus-node-exporter
          action: keep
    kube-state-metrics:
      kubernetes_sd_configs:
        - role: endpoints
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_name]
          regex: obs-stack-kube-state-metrics
          action: keep
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          regex: http
          action: keep
  scrapeConfigFiles: []
  serverFiles:
    prometheus.yml:
      otlp:
        keep_identifying_resource_attributes: true
        promote_resource_attributes:
          - service.instance.id
          - service.name
          - service.namespace
          - service.version
          - deployment.environment.name
          - gen_ai.agent.id
          - gen_ai.agent.name
          - gen_ai.provider.name
          - gen_ai.request.model
          - gen_ai.response.model
      storage:
        tsdb:
          out_of_order_time_window: 30m
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: true
  prometheus-node-exporter:
    enabled: true
  prometheus-pushgateway:
    enabled: false

# -- Global settings
# NOTE: opensearchUsername/Password are the single source of truth.
# OpenSearch and OSD reference these via extraEnvs/config.
# Data Prepper pipeline configs don't support templating, so the password
# is duplicated there — update both if you change it.
opensearchUsername: "admin"
opensearchPassword: "My_password_123!@#"

# -- OpenSearch Prometheus Exporter
opensearchExporter:
  enabled: true
  image:
    repository: prometheuscommunity/elasticsearch-exporter
    tag: v1.10.0

# -- Example agents (matches docker-compose.examples.yml)
examples:
  enabled: true
  imagePullPolicy: IfNotPresent
  weatherAgent:
    image: "ghcr.io/kylehounslow/observability-stack/weather-agent:latest"
  eventsAgent:
    image: "ghcr.io/kylehounslow/observability-stack/events-agent:latest"
  travelPlanner:
    image: "ghcr.io/kylehounslow/observability-stack/travel-planner:latest"
  mcpServer:
    image: "ghcr.io/kylehounslow/observability-stack/mcp-server:latest"
  canary:
    image: "ghcr.io/kylehounslow/observability-stack/canary:latest"
    interval: "120"

# -- OpenTelemetry Demo (optional)
# Full microservices e-commerce app that generates realistic telemetry.
# Disabled by default — adds ~2GB memory. Enable with opentelemetry-demo.enabled=true.
# All bundled backends (jaeger, grafana, prometheus, opensearch, collector) are disabled —
# demo services send telemetry to our OTel Collector instead.
opentelemetry-demo:
  enabled: false
  default:
    envOverrides:
      - name: OTEL_COLLECTOR_NAME
        value: obs-stack-opentelemetry-collector
  # Disable all bundled backends — we use our own stack
  opentelemetry-collector:
    enabled: false
  jaeger:
    enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false
  opensearch:
    enabled: false

# -- Gateway API for OpenSearch Dashboards
# Requires: Gateway API CRDs + a gateway controller installed on the cluster.
# Supported providers: envoy (Envoy Gateway), aws (AWS Gateway API Controller).
# Contributors welcome to add: gcp, azure, etc.
gateway:
  enabled: false
  # provider: envoy or aws
  provider: envoy
  # className maps to GatewayClass installed by your controller
  className: eg
  # host: dashboards.example.com
  annotations: {}
  tls: {}
    # secretName: dashboards-tls  # K8s TLS secret (envoy)
  #
  # --- Envoy Gateway ---
  # Requires: https://gateway.envoyproxy.io/docs/install/
  #   provider: envoy
  #   className: eg
  #   host: dashboards.example.com
  #   tls:
  #     secretName: dashboards-tls  # cert-manager or manual secret
  #
  # --- AWS Gateway API Controller ---
  # Requires: https://www.gateway-api-controller.eks.aws.dev/
  #   provider: aws
  #   className: amazon-vpc-lattice
  #   host: dashboards.example.com
  #   annotations:
  #     application-networking.k8s.aws/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/ID
