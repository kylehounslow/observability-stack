suite: ebpf demo
templates:
  - templates/ebpf-demo.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render four services and a loadgen when enabled
    set:
      ebpfDemo.enabled: true
    asserts:
      - hasDocuments:
          count: 9  # 4 deployments + 4 services + loadgen
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: storefront
          any: true
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: ebpf-demo-loadgen
          any: true

  - it: should label pods for the OBI selector
    set:
      ebpfDemo.enabled: true
    documentIndex: 2  # catalog Deployment
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: ebpf-demo
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/kylehounslow/observability-stack/ebpf-demo-java:latest

  - it: should call frontend-proxy only when opentelemetry-demo is enabled
    set:
      ebpfDemo.enabled: true
      opentelemetry-demo.enabled: true
    documentIndex: 0  # storefront Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CALLS
            value: http://catalog:8080/products,http://ratings:8080/ratings,http://frontend-proxy:8080/api/products

  - it: should not call frontend-proxy without opentelemetry-demo
    set:
      ebpfDemo.enabled: true
    documentIndex: 0  # storefront Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CALLS
            value: http://catalog:8080/products,http://ratings:8080/ratings
