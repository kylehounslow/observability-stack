{{- if .Values.opensearchExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability-stack.fullname" . }}-opensearch-exporter
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: opensearch-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/component: opensearch-exporter
    spec:
      containers:
        - name: opensearch-exporter
          image: "{{ .Values.opensearchExporter.image.repository }}:{{ .Values.opensearchExporter.image.tag }}"
          args:
            - --es.uri=https://opensearch-cluster-master:9200
            - --es.ssl-skip-verify
            - --es.all
            - --es.indices
            - --es.shards
          env:
            - name: ES_USERNAME
              value: {{ .Values.opensearchUsername | default "admin" | quote }}
            - name: ES_PASSWORD
              value: {{ .Values.opensearchPassword | default "My_password_123!@#" | quote }}
          ports:
            - containerPort: 9114
              name: metrics
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9114
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9114
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observability-stack.fullname" . }}-opensearch-exporter
  labels:
    {{- include "observability-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch-exporter
spec:
  selector:
    app.kubernetes.io/component: opensearch-exporter
  ports:
    - port: 9114
      targetPort: 9114
      name: metrics
{{- end }}
